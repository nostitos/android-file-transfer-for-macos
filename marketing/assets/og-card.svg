  <g font-family="Avenir Next">
    <text x="745" y="113" fill="#9bc654" font-family="Menlo" font-size="14" font-weight="700" letter-spacing="1">FREE · OPEN SOURCE · USB</text>
    <text x="742" y="205" fill="#fffdf8" font-family="Georgia" font-size="61" font-weight="600">
      <tspan x="742">Android File</tspan><tspan x="742" dy="62">Transfer</tspan><tspan x="742" dy="62" fill="#9bc654">for macOS</tspan>
    </text>
    <path d="M745 410h390" stroke="#607b45" stroke-width="3"/>
    <text x="745" y="454" fill="#d9e1df" font-size="21">Browse and copy files both ways.</text>
    <text x="745" y="490" fill="#d9e1df" font-size="21">No cloud, account, or phone app.</text>
    <text x="745" y="534" fill="#e0a342" font-size="17" font-weight="700">macOS 13+ · Apple silicon + Intel</text>
    <text x="40" y="598" fill="#97aaa7" font-size="16">android-file-transfer-for-macos</text>
    <text x="1160" y="598" fill="#97aaa7" font-size="16" text-anchor="end">Early release</text>
