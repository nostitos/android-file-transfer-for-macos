<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Android File Transfer for macOS</title>
  <desc id="desc">An original green phone character and blue Mac character exchange files over a physical USB cable beside the project name.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1140" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17353b"/>
      <stop offset="1" stop-color="#091b1f"/>
    </linearGradient>
    <linearGradient id="green" x1="75" y1="145" x2="370" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8d35b"/>
      <stop offset="1" stop-color="#52634a"/>
    </linearGradient>
    <linearGradient id="blue" x1="410" y1="145" x2="670" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ab2ea"/>
      <stop offset="1" stop-color="#245d7a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#031013" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#10282d"/>
