    <rect x="405" y="143" width="251" height="434" rx="78" fill="#245d7a" stroke="#17485f" stroke-width="8"/>
    <rect x="438" y="211" width="185" height="220" rx="52" fill="#b9d9ea" stroke="#1d5877" stroke-width="7"/>
