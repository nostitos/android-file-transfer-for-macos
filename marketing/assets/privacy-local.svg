<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A direct local USB path</title>
  <desc id="desc">File contents travel over one physical cable between Android shared storage and the Mac. Update checks fetch public release metadata from GitHub; they do not upload phone files or identifiers.</desc>
  <rect width="1600" height="900" fill="#f3efe5"/>
  <g font-family="Avenir Next">
    <text x="85" y="82" fill="#607b45" font-family="Menlo" font-size="18" font-weight="700" letter-spacing="3">PRIVACY MODEL</text>
    <text x="82" y="162" fill="#13272a" font-family="Georgia" font-size="70" font-weight="600">One cable. No detour.</text>
    <text x="85" y="211" fill="#405c61" font-size="23">File contents move between devices over USB. The app has no analytics or telemetry.</text>
  </g>
  <g>
    <rect x="110" y="320" width="285" height="355" rx="56" fill="#607b45" stroke="#35472d" stroke-width="8"/>
    <rect x="147" y="370" width="211" height="224" rx="29" fill="#dfe9ce"/>
    <circle cx="252" cy="631" r="13" fill="#dfe9ce"/>
    <path d="m175 332-27-46m220 46 27-46" stroke="#78a443" stroke-width="18" stroke-linecap="round"/>
    <text x="252" y="453" fill="#35472d" text-anchor="middle" font-family="Avenir Next" font-size="28" font-weight="700">ANDROID</text>
    <text x="252" y="493" fill="#52634a" text-anchor="middle" font-family="Avenir Next" font-size="18">shared storage</text>
    <rect x="1205" y="320" width="285" height="355" rx="56" fill="#245d7a" stroke="#17485f" stroke-width="8"/>
    <rect x="1242" y="370" width="211" height="224" rx="29" fill="#d8edfa"/>
    <rect x="1289" y="621" width="116" height="15" rx="8" fill="#153e55"/>
    <text x="1347" y="453" fill="#17485f" text-anchor="middle" font-family="Avenir Next" font-size="28" font-weight="700">MAC</text>
    <text x="1347" y="493" fill="#245d7a" text-anchor="middle" font-family="Avenir Next" font-size="18">chosen folder</text>
    <path d="M395 504h810" stroke="#172323" stroke-width="28" stroke-linecap="round"/>
    <rect x="375" y="468" width="48" height="72" rx="12" fill="#343d3d"/><rect x="1177" y="468" width="48" height="72" rx="12" fill="#343d3d"/>
    <path d="M575 504h450" stroke="#9bc654" stroke-width="8" stroke-dasharray="14 17"/>
    <path d="m1025 504-30-22v44Z" fill="#9bc654"/><path d="m575 504 30-22v44Z" fill="#e0a342"/>
    <rect x="670" y="419" width="260" height="170" fill="#fffdf8" stroke="#c8c7bd" stroke-width="5"/>
    <path d="M670 419h170l90 90" fill="#e8e4d9" stroke="#c8c7bd" stroke-width="5"/>
    <text x="800" y="523" fill="#13272a" text-anchor="middle" font-family="Menlo" font-size="18" font-weight="700">FILE CONTENTS</text>
    <text x="800" y="556" fill="#607b45" text-anchor="middle" font-family="Avenir Next" font-size="18">direct over USB</text>
  </g>
  <g transform="translate(100 744)" font-family="Avenir Next">
    <g transform="translate(0)"><circle cx="35" cy="35" r="33" fill="#ead9bf"/><path d="M18 47c7-27 28-30 35-1m-27-20a10 10 0 1 0 20 0 10 10 0 1 0-20 0" fill="none" stroke="#7b5a32" stroke-width="5"/><path d="M12 58 58 12" stroke="#b54f40" stroke-width="6"/><text x="82" y="42" fill="#13272a" font-size="19" font-weight="700">No account</text></g>
    <g transform="translate(285)"><circle cx="35" cy="35" r="33" fill="#dce8ea"/><path d="M18 45h37c11 0 11-17 0-17-2-19-31-19-34 0-11 0-13 17-3 17Z" fill="none" stroke="#315159" stroke-width="5"/><path d="M12 58 58 12" stroke="#b54f40" stroke-width="6"/><text x="82" y="42" fill="#13272a" font-size="19" font-weight="700">No cloud transfer</text></g>
    <g transform="translate(650)"><circle cx="35" cy="35" r="33" fill="#e4ead8"/><rect x="22" y="13" width="27" height="44" rx="6" fill="none" stroke="#607b45" stroke-width="5"/><path d="M12 58 58 12" stroke="#b54f40" stroke-width="6"/><text x="82" y="42" fill="#13272a" font-size="19" font-weight="700">No phone app</text></g>
    <g transform="translate(990)"><circle cx="35" cy="35" r="33" fill="#efe0c6"/><path d="M18 45h34M24 29h22M30 16h10" stroke="#7b5a32" stroke-width="5" stroke-linecap="round"/><path d="M12 58 58 12" stroke="#b54f40" stroke-width="6"/><text x="82" y="42" fill="#13272a" font-size="19" font-weight="700">No telemetry</text></g>
  </g>
  <text x="1510" y="862" fill="#5e7376" text-anchor="end" font-family="Menlo" font-size="14">Update checks fetch GitHub release metadata; file contents stay on USB.</text>
</svg>
