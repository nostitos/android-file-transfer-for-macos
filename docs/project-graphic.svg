<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Android File Transfer for macOS</title>
  <desc id="description">A green Android-inspired character and blue Mac-inspired computer exchange files through a USB cable.</desc>
  <defs>
    <linearGradient id="backdrop" x1="60" y1="38" x2="1220" y2="602" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173036"/>
      <stop offset="1" stop-color="#0d2025"/>
    </linearGradient>
    <linearGradient id="android" x1="70" y1="152" x2="352" y2="522" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9dc84f"/>
      <stop offset="1" stop-color="#52634a"/>
    </linearGradient>
    <linearGradient id="mac" x1="385" y1="132" x2="620" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ca7e5"/>
      <stop offset="1" stop-color="#245d7a"/>
    </linearGradient>
    <linearGradient id="screen" x1="430" y1="204" x2="566" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8edfa"/>
      <stop offset="1" stop-color="#8fbed8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#071315" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect x="22" y="22" width="1236" height="596" rx="44" fill="url(#backdrop)"/>
  <rect x="24" y="24" width="1232" height="592" rx="42" fill="none" stroke="#315159" stroke-width="3"/>

  <g filter="url(#shadow)">
    <!-- Android-inspired character. -->
    <path d="M72 300c0-90 55-153 132-153s132 63 132 153v191c0 51-38 88-89 88h-86c-51 0-89-37-89-88Z" fill="url(#android)" stroke="#394f31" stroke-width="8"/>
    <path d="m125 170-31-54m220 54 31-54" fill="none" stroke="#78a443" stroke-width="18" stroke-linecap="round"/>
    <circle cx="151" cy="306" r="19" fill="#fffdf8"/>
    <circle cx="257" cy="306" r="19" fill="#fffdf8"/>
    <path d="M160 373c16 25 72 25 88 0" fill="none" stroke="#233229" stroke-width="13" stroke-linecap="round"/>
    <circle cx="278" cy="494" r="22" fill="none" stroke="#405b34" stroke-width="11" opacity="0.68"/>

    <!-- Mac-inspired computer character. -->
    <g transform="translate(36 0)">
      <rect x="394" y="142" width="252" height="437" rx="79" fill="url(#mac)" stroke="#17485f" stroke-width="8"/>
      <rect x="428" y="210" width="184" height="220" rx="54" fill="url(#screen)" stroke="#1d5877" stroke-width="7"/>
      <rect x="467" y="487" width="106" height="16" rx="8" fill="#153e55"/>
      <circle cx="601" cy="514" r="9" fill="#d9c25f"/>
      <rect x="467" y="274" width="15" height="41" rx="8" fill="#173950"/>
      <rect x="557" y="274" width="15" height="41" rx="8" fill="#173950"/>
      <path d="M474 357c22 37 71 37 92 0" fill="none" stroke="#173950" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Cable and connectors. -->
    <path d="M326 414h116" fill="none" stroke="#111b1d" stroke-width="24" stroke-linecap="round"/>
    <rect x="309" y="386" width="36" height="56" rx="9" fill="#343d3d"/>
    <rect x="423" y="386" width="36" height="56" rx="9" fill="#343d3d"/>
    <rect x="300" y="398" width="14" height="32" rx="3" fill="#d6d8d1"/>
    <rect x="454" y="398" width="14" height="32" rx="3" fill="#d6d8d1"/>

    <!-- File moving Android to Mac. -->
    <path d="M316 188h49l31 31v83c0 12-10 22-22 22h-58c-12 0-22-10-22-22v-92c0-12 10-22 22-22Z" fill="#fffdf8" stroke="#c8c7bd" stroke-width="6"/>
    <path d="M365 188v31h31" fill="#ebe8de" stroke="#c8c7bd" stroke-width="6" stroke-linejoin="round"/>
    <path d="M315 271h58m-17-16 17 16-17 16" fill="none" stroke="#52634a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M273 257c-30 0-45-1-64-13" fill="none" stroke="#88a953" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 15"/>

    <!-- File moving Mac to Android. -->
    <path d="M328 448h49l31 31v83c0 12-10 22-22 22h-58c-12 0-22-10-22-22v-92c0-12 10-22 22-22Z" fill="#fffdf8" stroke="#c8c7bd" stroke-width="6"/>
    <path d="M377 448v31h31" fill="#ebe8de" stroke="#c8c7bd" stroke-width="6" stroke-linejoin="round"/>
    <path d="M388 531h-58m17-16-17 16 17 16" fill="none" stroke="#a5641a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M440 516c32 0 47-1 67-14" fill="none" stroke="#c48736" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 15"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="720" y="214" fill="#fffdf8" font-size="52" font-weight="700" letter-spacing="-1.2">
      <tspan x="720" dy="0">Android File Transfer</tspan>
      <tspan x="720" dy="61">for macOS</tspan>
    </text>
    <path d="M720 316h470" stroke="#607b53" stroke-width="4"/>
    <text x="720" y="372" fill="#a7c66c" font-size="24" font-weight="500">Free and open-source USB file transfer.</text>
    <text x="720" y="422" fill="#fffdf8" font-size="23">No cloud. No account. No subscription.</text>
    <text x="720" y="476" fill="#e0a342" font-size="23" font-weight="500">This is basic device interoperability.</text>
  </g>
</svg>
