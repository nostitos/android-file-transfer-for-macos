name: Signed macOS release

on:
  workflow_dispatch:
    inputs:
      signing_identity:
        description: Exact Developer ID Application signing identity from the imported certificate
        required: true
        type: string
      csc_certificate_name:
        description: Certificate name electron-builder must select from the imported keychain
        required: true
        type: string
      team_id:
        description: Apple Developer Team ID expected on every signed release binary
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-15
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - id: release
        name: Bind package version, tag, and workflow SHA
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          VERSION="$(node -p "require('./package.json').version")"
          node -e '
            const version = process.argv[1];
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error("package.json version is not a release version: " + version);
            }
          ' "$VERSION"
          {
            printf 'release_tag=v%s\n' "$VERSION"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CI: "true"
      TARGET_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      NATIVE_DEPS_PREFIX: ${{ github.workspace }}/.native-deps/${{ matrix.arch }}
      SIGNING_IDENTITY: ${{ inputs.signing_identity }}
      CSC_CERTIFICATE_NAME: ${{ inputs.csc_certificate_name }}
      EXPECTED_TEAM_ID: ${{ inputs.team_id }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - name: Confirm checked-out release source
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Confirm package version matches release tag
        run: test "v$(node -p "require('./package.json').version")" = "${{ needs.prepare.outputs.release_tag }}"
      - name: Install build tools
        run: brew install pkg-config
      - run: npm ci
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F -- "$SIGNING_IDENTITY"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            if [[ -n "$keychain" ]]; then ORIGINAL_KEYCHAINS+=("$keychain"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIGINAL_KEYCHAINS[@]}"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - run: npm run check:public-source
      - run: npm audit --omit=dev --audit-level=high
      - name: Build, sign, notarize, and verify DMG
        run: npm run release:mac -- ${{ matrix.arch }}
      - name: Smoke test packaged helper and native app launch
        run: |
          APP_PATH="$(find "release/${{ matrix.arch }}" -maxdepth 3 -type d -name 'Android File Transfer for macOS.app' -print -quit)"
          test -n "$APP_PATH"
          bash scripts/smoke-packaged-app.sh "$APP_PATH" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-dmg-${{ matrix.arch }}
          path: release/assets/Android-File-Transfer-for-macOS-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.dmg
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/developer-id.p12"

  publish:
    needs: [prepare, build]
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_TEAM_ID: ${{ inputs.team_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - name: Confirm checked-out release source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-dmg-*
          path: release/assets
          merge-multiple: true
      - run: npm run release:sources -- "$VERSION"
      - run: bash scripts/create-checksums.sh release/assets
      - name: Verify collected artifacts
        run: |
          set -euo pipefail
          expected_assets="$(printf '%s\n' \
            "Android-File-Transfer-for-macOS-$VERSION-arm64.dmg" \
            "Android-File-Transfer-for-macOS-$VERSION-x64.dmg" \
            "THIRD_PARTY_SOURCES-$VERSION.tar.gz" \
            'SHA256SUMS.txt' | LC_ALL=C sort)"
          actual_assets="$(find release/assets -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi
          test -z "$(find release/assets -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          bash scripts/verify-macos-release.sh "release/assets/Android-File-Transfer-for-macOS-$VERSION-arm64.dmg" arm64 "$VERSION"
          bash scripts/verify-macos-release.sh "release/assets/Android-File-Transfer-for-macOS-$VERSION-x64.dmg" x64 "$VERSION"
          (cd release/assets && shasum -a 256 -c SHA256SUMS.txt)
      - name: Create or update draft release
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$TAG" release/assets/* --clobber
          else
            gh release create "$TAG" release/assets/* --draft --prerelease --target "$SOURCE_SHA" --title "$TAG" --generate-notes
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
      - name: Download and independently reverify release assets
        run: |
          set -euo pipefail
          rm -rf .tmp/release-download
          mkdir -p .tmp/release-download
          gh release download "$TAG" --dir .tmp/release-download
          expected_assets="$(printf '%s\n' \
            "Android-File-Transfer-for-macOS-$VERSION-arm64.dmg" \
            "Android-File-Transfer-for-macOS-$VERSION-x64.dmg" \
            "THIRD_PARTY_SOURCES-$VERSION.tar.gz" \
            'SHA256SUMS.txt' | LC_ALL=C sort)"
          actual_assets="$(find .tmp/release-download -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi
          test -z "$(find .tmp/release-download -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          (cd .tmp/release-download && shasum -a 256 -c SHA256SUMS.txt)
          bash scripts/verify-macos-release.sh ".tmp/release-download/Android-File-Transfer-for-macOS-$VERSION-arm64.dmg" arm64 "$VERSION"
          bash scripts/verify-macos-release.sh ".tmp/release-download/Android-File-Transfer-for-macOS-$VERSION-x64.dmg" x64 "$VERSION"
      - name: Publish as a pre-release
        run: gh release edit "$TAG" --draft=false --prerelease=true
