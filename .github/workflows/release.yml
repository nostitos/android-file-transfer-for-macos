name: Signed macOS release

on:
  workflow_dispatch:
    inputs:
      signing_identity:
        description: Exact Developer ID Application signing identity from the imported certificate
        required: true
        type: string
      csc_certificate_name:
        description: Certificate name electron-builder must select from the imported keychain
        required: true
        type: string
      team_id:
        description: Apple Developer Team ID expected on every signed release binary
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-15
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - id: release
        name: Bind package version, tag, and workflow SHA
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          VERSION="$(node -p "require('./package.json').version")"
          node -e '
            const version = process.argv[1];
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error("package.json version is not a release version: " + version);
            }
          ' "$VERSION"
          {
            printf 'release_tag=v%s\n' "$VERSION"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CI: "true"
      TARGET_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      NATIVE_DEPS_PREFIX: ${{ github.workspace }}/.native-deps/${{ matrix.arch }}
      SIGNING_IDENTITY: ${{ inputs.signing_identity }}
      CSC_CERTIFICATE_NAME: ${{ inputs.csc_certificate_name }}
      EXPECTED_TEAM_ID: ${{ inputs.team_id }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - name: Confirm checked-out release source
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Confirm package version matches release tag
        run: test "v$(node -p "require('./package.json').version")" = "${{ needs.prepare.outputs.release_tag }}"
      - name: Install build tools
        run: brew install pkg-config
      - run: npm ci
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F -- "$SIGNING_IDENTITY"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            if [[ -n "$keychain" ]]; then ORIGINAL_KEYCHAINS+=("$keychain"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIGINAL_KEYCHAINS[@]}"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - run: npm run check:public-source
      - run: npm audit --omit=dev --audit-level=high
      - name: Build, sign, notarize, and verify DMG and update ZIP
        run: npm run release:mac -- ${{ matrix.arch }}
      - name: Smoke test packaged helper and native app launch
        run: |
          APP_PATH="$(find "release/${{ matrix.arch }}" -maxdepth 3 -type d -name 'Android File Transfer for macOS.app' -print -quit)"
          test -n "$APP_PATH"
          bash scripts/smoke-packaged-app.sh "$APP_PATH" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos-${{ matrix.arch }}
          path: |
            release/assets/Android-File-Transfer-for-macOS-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.dmg
            release/assets/Android-File-Transfer-for-macOS-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/developer-id.p12"

  publish:
    needs: [prepare, build]
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_TEAM_ID: ${{ inputs.team_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - name: Confirm checked-out release source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node scripts/check-update-manifest.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-macos-*
          path: release/assets
          merge-multiple: true
      - name: Prepare manifest, sources, checksums, and verify collected artifacts
        run: bash scripts/prepare-release-assets.sh release/assets "$VERSION"
      - name: Upload draft, re-download and verify, then publish stable release
        run: bash scripts/publish-macos-release.sh release/assets "$VERSION"
