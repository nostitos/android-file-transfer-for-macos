name: Publish website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published release and downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$(node -p "require('./release-manifest.json').tag")"
          if [[ -n "$RELEASE_EVENT_TAG" && "$RELEASE_EVENT_TAG" != "$tag" ]]; then
            echo "Ignoring release $RELEASE_EVENT_TAG; website targets $tag"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/website-release.json"
          node website/verify-release.mjs "$RUNNER_TEMP/website-release.json"
      - name: Build static website
        run: node website/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
