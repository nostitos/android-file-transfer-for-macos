<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Android File Transfer for macOS app icon</title>
  <desc id="description">An original green Android-inspired character and blue Mac-inspired computer exchange a file over USB.</desc>
  <defs>
    <linearGradient id="plate" x1="142" y1="112" x2="892" y2="914" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#e7ece3"/>
    </linearGradient>
    <linearGradient id="android" x1="180" y1="270" x2="440" y2="805" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#92bc47"/>
      <stop offset="1" stop-color="#52634a"/>
    </linearGradient>
    <linearGradient id="mac" x1="600" y1="250" x2="860" y2="802" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4d96d8"/>
      <stop offset="1" stop-color="#245d7a"/>
    </linearGradient>
    <linearGradient id="screen" x1="648" y1="342" x2="806" y2="614" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8edfa"/>
      <stop offset="1" stop-color="#8fbed8"/>
    </linearGradient>
    <filter id="plate-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#17211d" flood-opacity="0.22"/>
    </filter>
    <filter id="figure-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17211d" flood-opacity="0.26"/>
    </filter>
  </defs>

  <g filter="url(#plate-shadow)">
    <rect x="72" y="72" width="880" height="880" rx="210" fill="url(#plate)"/>
    <rect x="91" y="91" width="842" height="842" rx="194" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="7"/>
  </g>

  <g filter="url(#figure-shadow)">
    <!-- Android-inspired character, intentionally redrawn with original proportions. -->
    <path d="M155 455c0-117 71-199 171-199s171 82 171 199v250c0 66-49 115-115 115H270c-66 0-115-49-115-115Z" fill="url(#android)" stroke="#35472d" stroke-width="12"/>
    <path d="M224 286 183 216M426 286l41-70" fill="none" stroke="#5d7f36" stroke-width="25" stroke-linecap="round"/>
    <circle cx="257" cy="464" r="25" fill="#fffdf8"/>
    <circle cx="394" cy="464" r="25" fill="#fffdf8"/>
    <path d="M269 552c20 31 91 31 112 0" fill="none" stroke="#26352f" stroke-width="17" stroke-linecap="round"/>
    <circle cx="422" cy="728" r="29" fill="none" stroke="#405b34" stroke-width="14" opacity="0.7"/>

    <!-- Mac-inspired computer character, not a verbatim Finder or Apple mark. -->
    <rect x="548" y="252" width="324" height="568" rx="102" fill="url(#mac)" stroke="#17485f" stroke-width="12"/>
    <rect x="592" y="340" width="236" height="286" rx="70" fill="url(#screen)" stroke="#1d5877" stroke-width="10"/>
    <rect x="642" y="700" width="136" height="20" rx="10" fill="#153e55"/>
    <circle cx="815" cy="735" r="12" fill="#d9c25f"/>
    <rect x="642" y="422" width="20" height="54" rx="10" fill="#173950"/>
    <rect x="758" y="422" width="20" height="54" rx="10" fill="#173950"/>
    <path d="M651 531c28 48 91 48 119 0" fill="none" stroke="#173950" stroke-width="18" stroke-linecap="round"/>

    <!-- Physical USB bridge. -->
    <path d="M482 662h81" fill="none" stroke="#1a2423" stroke-width="31" stroke-linecap="round"/>
    <rect x="461" y="626" width="46" height="72" rx="12" fill="#303938"/>
    <rect x="544" y="626" width="46" height="72" rx="12" fill="#303938"/>
    <rect x="451" y="641" width="15" height="42" rx="4" fill="#d6d8d1"/>
    <rect x="585" y="641" width="15" height="42" rx="4" fill="#d6d8d1"/>

    <!-- One file tile with two independent transfer directions. -->
    <path d="M455 354h83l55 55v149c0 20-16 36-36 36H455c-20 0-36-16-36-36V390c0-20 16-36 36-36Z" fill="#fffdf8" stroke="#c8c7bd" stroke-width="9"/>
    <path d="M538 354v55h55" fill="#ebe8de" stroke="#c8c7bd" stroke-width="9" stroke-linejoin="round"/>
    <path d="M448 458h106m-28-27 28 27-28 27" fill="none" stroke="#52634a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M557 520H451m28-27-28 27 28 27" fill="none" stroke="#a5641a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
